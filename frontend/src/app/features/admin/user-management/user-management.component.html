<app-page-header
  icon="group"
  title="User management"
  subtitle="Create accounts, assign roles, and grant fine-grained permissions. Authorization is enforced on every API call."
/>

<div class="toolbar">
  <button mat-flat-button color="primary" type="button" (click)="openCreate()">
    <mat-icon>person_add</mat-icon>
    Add user
  </button>
</div>

@if (loading && !dataSource.data.length) {
  <mat-progress-bar mode="indeterminate" />
}

<div class="table-wrap mat-elevation-z1">
  <table mat-table [dataSource]="dataSource" class="users-table">
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef>Name</th>
      <td mat-cell *matCellDef="let row">{{ row.name }}</td>
    </ng-container>

    <ng-container matColumnDef="email">
      <th mat-header-cell *matHeaderCellDef>Email</th>
      <td mat-cell *matCellDef="let row">{{ row.email }}</td>
    </ng-container>

    <ng-container matColumnDef="role">
      <th mat-header-cell *matHeaderCellDef>Role</th>
      <td mat-cell *matCellDef="let row">{{ row.role }}</td>
    </ng-container>

    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef>Status</th>
      <td mat-cell *matCellDef="let row">
        <span [class.inactive]="!row.active">{{ row.active ? 'Active' : 'Inactive' }}</span>
      </td>
    </ng-container>

    <ng-container matColumnDef="permissionCount">
      <th mat-header-cell *matHeaderCellDef>Permissions</th>
      <td mat-cell *matCellDef="let row">{{ row.permissionCount }}</td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef class="col-actions">Actions</th>
      <td mat-cell *matCellDef="let row" class="col-actions">
        <button mat-button type="button" (click)="openEdit(row)">Edit</button>
        <button
          mat-button
          type="button"
          color="warn"
          [disabled]="!canDeactivate(row)"
          (click)="deactivate(row)"
        >
          Deactivate
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>

  <mat-paginator
    [length]="totalElements"
    [pageSize]="pageSize"
    [pageIndex]="pageIndex"
    [pageSizeOptions]="[10, 20, 50]"
    (page)="onPage($event)"
    showFirstLastButtons
  />
</div>
