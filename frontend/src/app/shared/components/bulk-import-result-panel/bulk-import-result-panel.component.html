<mat-card appearance="outlined" class="bulk-import-result">
  <mat-card-content>
    <div class="bulk-import-result__head">
      <h3 class="bulk-import-result__title">{{ heading }}</h3>
      <span class="bulk-import-result__counts">
        <span class="bulk-import-result__ok">{{ result.successCount }} imported</span>
        @if (result.failureCount > 0) {
          <span class="bulk-import-result__fail">{{ result.failureCount }} skipped</span>
        }
      </span>
      <button mat-icon-button type="button" (click)="dismiss.emit()" aria-label="Dismiss import summary">
        <mat-icon>close</mat-icon>
      </button>
    </div>
    @if (result.errors.length > 0) {
      <div class="bulk-import-result__table-wrap">
        <table mat-table [dataSource]="result.errors" class="bulk-import-result__table">
          <ng-container matColumnDef="row">
            <th mat-header-cell *matHeaderCellDef>Row</th>
            <td mat-cell *matCellDef="let e">{{ e.row }}</td>
          </ng-container>
          <ng-container matColumnDef="message">
            <th mat-header-cell *matHeaderCellDef>Message</th>
            <td mat-cell *matCellDef="let e">{{ e.message }}</td>
          </ng-container>
          <tr mat-header-row *matHeaderRowDef="errorColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: errorColumns"></tr>
        </table>
      </div>
    } @else if (result.failureCount === 0) {
      <p class="bulk-import-result__all-ok">All rows processed successfully.</p>
    }
  </mat-card-content>
</mat-card>
