<div class="dha-map map-container glass">
  <div class="dha-map__gradient-scrim" aria-hidden="true"></div>
  <div class="dha-map__stage">
    @if (!showMapHost) {
      <div class="dha-map__placeholder" aria-hidden="true">
        <img
          [src]="placeholderSrc"
          alt=""
          class="dha-map__placeholder-img"
          width="1200"
          height="600"
          fetchpriority="high"
          decoding="async"
        />
      </div>
    } @else {
      <div #fullscreenRoot class="dha-map__stage-inner">
        @if (mapReady) {
          <div class="dha-map__toolbar" role="toolbar" aria-label="Map controls">
            <button
              mat-stroked-button
              type="button"
              color="primary"
              (click)="toggleBasemap()"
            >
              {{ basemapToggleLabel }}
            </button>
            <button
              mat-stroked-button
              type="button"
              (click)="toggleFullscreen()"
            >
              {{ fullscreenToggleLabel }}
            </button>
            <button
              mat-stroked-button
              type="button"
              (click)="openGoogleMapsExternal()"
            >
              Google Maps
            </button>
          </div>
        }
        <div
          #mapHost
          class="dha-map__host"
          [class.dha-map__host--visible]="mapReady"
          role="presentation"
        ></div>
        @if (!mapReady) {
          <div
            class="dha-map__placeholder dha-map__placeholder--overlay"
            aria-busy="true"
            aria-label="Loading map"
          >
            <img
              [src]="placeholderSrc"
              alt=""
              class="dha-map__placeholder-img"
              width="1200"
              height="600"
              decoding="async"
            />
          </div>
        }
      </div>
    }
  </div>
</div>
